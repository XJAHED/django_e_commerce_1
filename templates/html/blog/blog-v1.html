{% extends 'base.html' %}
{% load static %}
{% block main_content %}

<main id="content">
<div class="mb-5 mb-lg-8 pb-xl-1">
<div class="mb-5 mb-lg-8 pb-xl-1">
<div class="page-header border-bottom">
<div class="container">
<div class="d-md-flex justify-content-between align-items-center py-4">
<h1 class="page-title font-size-3 font-weight-medium m-0 text-lh-lg">Blog List</h1>
<nav class="woocommerce-breadcrumb font-size-2">
<a href="../home/index.html" class="h-primary">Home</a>
<span class="breadcrumb-separator mx-1"><i class="fas fa-angle-right"></i></span>
<span>Blog List</span>
</nav>
</div>
</div>
</div>
</div>
<div class="container">
<div class="row mb-5 mb-lg-12 pb-xl-1">

<div class="col-lg-12 col-xl-12">
<div class="row row-cols-md-2">


{% for blog in blogs %}
<div class="col mb-4">
    <div class="card h-100 shadow-sm border-0">

        <a href="blog-single.html">
            <img
                src="{{ blog.image.url }}"
                alt="{{ blog.title }}"
                class="card-img-top w-100"
                style="height: 250px; object-fit: cover;">
        </a>

        <div class="card-body d-flex flex-column">

            <h5 class="card-title fw-bold mb-3" style="min-height: 60px;">
                <a href="blog-single.html" class="text-decoration-none text-dark">
                    {{ blog.title }}
                </a>
            </h5>

            <p class="card-text text-secondary text-justify flex-grow-1" style="text-align: justify;">
                {{ blog.discription|safe }}
            </p>

        </div>

        <div class="card-footer bg-white border-0 d-flex justify-content-between text-muted small">
            <span>{{ blog.date }}</span>
            <span>0 Comments</span>
        </div>

    </div>
</div>
{% endfor %}






</div>
</div>
</div>
