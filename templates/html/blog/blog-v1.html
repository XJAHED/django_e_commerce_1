{% extends 'base.html' %}
{% load static %}
{% block main_content %}

<main id="content">
<div class="mb-5 mb-lg-8 pb-xl-1">
<div class="mb-5 mb-lg-8 pb-xl-1">
<div class="page-header border-bottom">
<div class="container">
<div class="d-md-flex justify-content-between align-items-center py-4">
<h1 class="page-title font-size-3 font-weight-medium m-0 text-lh-lg">Blog List</h1>
<nav class="woocommerce-breadcrumb font-size-2">
<a href="../home/index.html" class="h-primary">Home</a>
<span class="breadcrumb-separator mx-1"><i class="fas fa-angle-right"></i></span>
<span>Blog List</span>
</nav>
</div>
</div>
</div>
</div>
<div class="container">
<div class="row mb-5 mb-lg-12 pb-xl-1">

<div class="col-lg-12 col-xl-12">
<div class="row row-cols-md-2">


{% for blog in blogs %}
<div class="col">
    <div class="mb-6">
    <a class="d-block mb-3" href="blog-single.html">
    <img class="img-fluid" src="{{blog.image.url}}" alt="Image-Description">
    </a>
    <h6 class="font-size-7 crop-text-2 font-weight-medium text-lh-1dot4">
    <a href="blog-single.html">{{blog.title}}</a>
    </h6>
    <p class="font-size-2 text-secondary-gray-700">{{blog.discription|safe}}</p>
    <div class="font-size-2 text-secondary-gray-700">
    <span>{{blog.date}}</span>
    <span class="ml-3">0 comments</span>
    </div>
    </div>
    </div>
{% endfor %}






</div>
</div>
</div>
<nav aria-label="Page navigation example">
<ul class="pagination pagination__custom justify-content-md-center flex-nowrap flex-md-wrap overflow-auto overflow-md-visble mb-0">
<li class="flex-shrink-0 flex-md-shrink-1 page-item"><a class="page-link" href="blog-v1.html#">Previous</a></li>
<li class="flex-shrink-0 flex-md-shrink-1 page-item"><a class="page-link" href="blog-v1.html#">1</a></li>
<li class="flex-shrink-0 flex-md-shrink-1 page-item"><a class="page-link" href="blog-v1.html#">2</a></li>
<li class="flex-shrink-0 flex-md-shrink-1 page-item active" aria-current="page"><a class="page-link" href="blog-v1.html#">3</a></li>
<li class="flex-shrink-0 flex-md-shrink-1 page-item"><a class="page-link" href="blog-v1.html#">4</a></li>
<li class="flex-shrink-0 flex-md-shrink-1 page-item"><a class="page-link" href="blog-v1.html#">5</a></li>
<li class="flex-shrink-0 flex-md-shrink-1 page-item"><a class="page-link" href="blog-v1.html#">Next</a></li>
</ul>
</nav>
</div>
</div>
</main>

{% endblock main_content %}
